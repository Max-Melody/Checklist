 <!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Piper PA-28</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 15px;
      padding: 0;
      background-color: #f4f4f9;
      text-align: center;
    }
    h1 { color: #333; margin-bottom: 10px; font-size: 22px; }
    
    /* MENU PRINCIPALE GRID */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      max-width: 450px;
      margin: 15px auto;
    }
    .btn-menu {
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background-color: #007bff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-menu:active { background-color: #0056b3; }
    .badge-status { font-size: 14px; background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 5px; }

    /* CARD E CONTROLLI CHECKLIST */
    .card {
      position: sticky;
      top: 10px;
      z-index: 100;
      background: white;
      border: 2px solid #007bff;
      border-radius: 10px;
      padding: 15px;
      margin: 10px auto;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .item-title { font-size: 20px; font-weight: bold; color: #333; }
    .item-status { font-size: 24px; font-weight: bold; color: #d9534f; margin-top: 8px; }
    
    .mic-status {
      font-size: 14px;
      font-weight: bold;
      margin-top: 8px;
      color: #666;
    }
    .mic-active { color: #28a745; }

    .btn {
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px;
    }
    .btn-start { background-color: #28a745; width: 85%; margin-top: 10px; }
    .btn-repeat { background-color: #ffc107; color: #333; }
    .btn-reset { background-color: #6c757d; }
    .btn-home { background-color: #17a2b8; }
    .btn-next { background-color: #28a745; font-size: 16px; padding: 14px 20px; margin-top: 10px; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;
    }
    th, td { border: 1px solid #ccc; padding: 12px 8px; text-align: left; }
    
    .section-header-row td {
      background-color: #e9ecef;
      font-weight: bold;
      text-align: center;
      color: #333;
    }

    .active-row { 
      background-color: #d4edda !important; 
      font-weight: bold; 
      border-left: 5px solid #28a745;
      color: #000 !important;
    }
    .skipped-row { 
      background-color: #dc3545 !important; 
      color: white !important; 
      font-weight: bold; 
      border-left: 5px solid #a71d2a;
    }

    .end-controls {
      display: none;
      margin-top: 15px;
      padding: 10px;
      background: #e9ecef;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- VISTA 1: MENU PRINCIPALE -->
  <div id="menuView">
    <h1>PIPER PA-28 CHECKLIST</h1>
    <div class="menu-grid" id="menuButtons"></div>
  </div>

  <!-- VISTA 2: ESECUZIONE CHECKLIST -->
  <div id="checklistView" style="display: none;">
    <h1 id="checklistTitle">CHECKLIST</h1>

    <div class="card">
      <div id="itemText" class="item-title">Premi AVVIA per iniziare</div>
      <div id="statusText" class="item-status">---</div>
      <div id="micStatus" class="mic-status">Microfono spento</div>
      <button id="startBtn" class="btn btn-start" onclick="startChecklist()">🎙️ AVVIA CHECKLIST</button>
      
      <div id="endControls" class="end-controls">
        <button id="nextChecklistBtn" class="btn btn-next" onclick="goToNextChecklist()">➡️ PROSSIMA CHECKLIST</button> <br>
        <button class="btn btn-home" onclick="showMenu()">📋 MENU PRINCIPALE</button>
      </div>
    </div>

    <div>
      <button class="btn btn-repeat" onclick="speakCurrent()">🔊 Ripeti</button>
      <button class="btn btn-reset" onclick="resetChecklist()">🔄 Ricomincia</button>
      <button class="btn btn-home" onclick="showMenu()">📋 Menu</button>
    </div>

    <table id="checklistTable">
      <thead>
        <tr>
          <th>Elemento</th>
          <th>Stato</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    // DEFINIZIONE STRUTTURA 10 CHECKLIST
    const checklistsData = [
      { 
        id: 0, 
        title: "1. CONTROLLI CABINA", 
        data: [
          { item: "Documenti pilota", status: "A BORDO", speak: "Documenti pilota: A bordo" },
          { item: "Documenti aeromobile", status: "A BORDO", speak: "Documenti aeromobile: A bordo" },
          { item: "Estintore / cassetta pronto soccorso", status: "A BORDO", speak: "Estintore e cassetta pronto soccorso: A bordo" },
          { item: "ELT", status: "Verificare OFF", speak: "ELT: Verificare OFF" },
          { item: "Giubbotti salvagente / Canotto / raft", status: "COME RICHIESTO", speak: "Giubbotti salvagente e canotto: Come richiesto" },
          { item: "Equipagg. per sosta Tacchi Olio", status: "COME RICHIESTO", speak: "Equipaggiamento per sosta, tacchi e olio: Come richiesto" },
          { item: "Comandi volo", status: "LIBERI E CORRETTI", speak: "Comandi di volo: Liberi e corretti" },
          { item: "Miscela", status: "CHIUSA", speak: "Miscela: Chiusa" },
          { item: "Magneti", status: "OFF", speak: "Magneti: OFF" },
          { item: "Interruttori elettrici", status: "OFF", speak: "Interruttori elettrici: OFF" },
          { item: "Radio e avionica", status: "OFF", speak: "Radio e avionica: OFF" },
          { item: "Circuit breakers", status: "INSERITI", speak: "Circuit breakers: Inseriti" },
          { item: "Batteria", status: "ON", speak: "Batteria: ON" },
          { item: "Carburante televel", status: "VERIFICARE", speak: "Carburante televel: Verificare" },
          { item: "Pannello annunciatore", status: "Spie ON", speak: "Pannello annunciatore: Spie ON" },
          { item: "Batteria", status: "OFF", speak: "Batteria: OFF" },
          { item: "Trim", status: "Zero", speak: "Trim: Zero" },
          { item: "Parabrezza e finestrini", status: "PULITI", speak: "Parabrezza e finestrini: Puliti" }
        ]
      },
      { 
        id: 1, 
        title: "2. AVVIAMENTO", 
        data: [
          { item: "Telefoni / disp elettronici", status: "OFF / MOD VOLO", speak: "Telefoni e dispositivi elettronici: OFF o Modalità Volo" },
          { item: "Briefing passeggeri", status: "COME RICHIESTO", speak: "Briefing passeggeri: Come richiesto" },
          { item: "Porta", status: "CHIUSA NO BLOCCATA", speak: "Porta: Chiusa non bloccata" },
          { item: "Freno parcheggio", status: "INSERITO", speak: "Freno parcheggio: Inserito" },
          { item: "Sedile", status: "REGOLATO E BLOCCATO", speak: "Sedile: Regolato e bloccato" },
          { item: "Interruttori elettrici", status: "OFF", speak: "Interruttori elettrici: OFF" },
          { item: "Ventilazione cabina", status: "OFF", speak: "Ventilazione cabina: OFF" },
          { item: "Circuit breakers", status: "INSERITI", speak: "Circuit breakers: Inseriti" },
          { item: "Master batteria / alternatore", status: "ON", speak: "Master batteria e alternatore: ON" },
          { item: "Rotating beacon", status: "ON", speak: "Rotating beacon: ON" },
          { item: "Aria carburatore", status: "OFF", speak: "Aria carburatore: OFF" },
          { item: "Miscela", status: "RICCA", speak: "Miscela: Ricca" },
          { item: "Serbatoio", status: "MENO PIENO", speak: "Serbatoio: Meno pieno" },
          { item: "Trim elettrico", status: "OFF", speak: "Trim elettrico: OFF" },
          { item: "Autopilot", status: "OFF", speak: "Autopilot: OFF" },
          { item: "Pompa elettrica carburante", status: "ON", speak: "Pompa elettrica carburante: ON" },
          { item: "Manetta", status: "1 cm", speak: "Manetta: Un centimetro", section: "AVVIAMENTO A FREDDO" },
          { item: "Primer", status: "3 / 4 volte poi BLOCCARE", speak: "Primer: Tre o quattro volte, poi bloccare" },
          { item: "Via dall'elica", status: "ANNUNCIARE", speak: "Via dall'elica: Annunciare" },
          { item: "Starter", status: "ON", speak: "Starter: ON" },
          { item: "Manetta", status: "1.200 RPM", speak: "Manetta: 1200 RPM" },
          { item: "Pressione OLIO", status: "ARCO VERDE ENTRO 30 \"", speak: "Pressione olio: Arco verde entro 30 secondi" },
          { item: "Pompa elettrica carburante", status: "OFF", speak: "Pompa elettrica carburante: OFF" }
        ]
      },
      { id: 2, title: "3. POST AVVIAMENTO", data: [] },
      { id: 3, title: "4. RULLAGGIO E RUN UP", data: [] },
      { id: 4, title: "5. PRE DECOLLO", data: [] },
      { id: 5, title: "6. ALLINEAMENTO", data: [] },
      { id: 6, title: "7. TAKE OFF E SALITA", data: [] },
      { id: 7, title: "8. CROCIERA", data: [] },
      { id: 8, title: "9. DISCESA E AVVICINAMENTO", data: [] },
      { id: 9, title: "10. SOTTOVENTO E FINALE", data: [] }
    ];

    let currentChecklistIndex = 0;
    let currentChecklist = [];
    let currentIndex = -1;
    let recognition;
    let isListening = false;
    let isSpeaking = false;
    let lastActionTime = 0;
    let skippedItems = new Set();
    
    let isAskingReview = false;
    let reviewQueue = [];
    let reviewIndex = -1;

    let wakeLock = null;
    let lastTapTime = 0;
    let lastTapIndex = -1;

    function renderMenu() {
      const menuContainer = document.getElementById('menuButtons');
      menuContainer.innerHTML = '';
      checklistsData.forEach((c, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-menu';
        btn.innerHTML = `<span>${c.title}</span> <span class="badge-status">${c.data.length > 0 ? 'PRONTA' : 'VUOTA'}</span>`;
        btn.onclick = () => openChecklist(idx);
        menuContainer.appendChild(btn);
      });
    }

    function showMenu() {
      resetChecklist();
      document.getElementById('checklistView').style.display = 'none';
      document.getElementById('menuView').style.display = 'block';
      renderMenu();
    }

    function openChecklist(index) {
      currentChecklistIndex = index;
      currentChecklist = checklistsData[index].data;
      document.getElementById('checklistTitle').innerText = checklistsData[index].title;
      document.getElementById('menuView').style.display = 'none';
      document.getElementById('checklistView').style.display = 'block';
      
      buildTable();
      resetChecklist();
    }

    function buildTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (currentChecklist.length === 0) {
        let row = tbody.insertRow();
        let cell = row.insertCell(0);
        cell.colSpan = 2;
        cell.style.textAlign = "center";
        cell.style.padding = "20px";
        cell.innerText = "Checklist in fase di inserimento...";
        return;
      }

      currentChecklist.forEach((entry, idx) => {
        if (entry.section) {
          let headerRow = tbody.insertRow();
          headerRow.className = "section-header-row";
          let cell = headerRow.insertCell(0);
          cell.colSpan = 2;
          cell.innerText = entry.section;
        }

        let row = tbody.insertRow();
        row.id = "row-" + idx;
        row.insertCell(0).innerText = entry.item;
        row.insertCell(1).innerText = entry.status;
        row.onclick = () => handleRowTap(idx);
      });
    }

    // Gestione WakeLock migliorata
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && wakeLock === null) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && isListening) {
        await requestWakeLock();
      }
    });

    function handleRowTap(index) {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTapTime;
      if (tapLength < 500 && tapLength > 0 && lastTapIndex === index) {
        selectItem(index);
      }
      lastTapTime = currentTime;
      lastTapIndex = index;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        if (isSpeaking || (Date.now() - lastActionTime < 600)) return;

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const spokenText = event.results[i][0].transcript.trim().toLowerCase();

          if (isAskingReview) {
            if (spokenText.includes("si") || spokenText.includes("sì") || spokenText.includes("verifica") || spokenText.includes("verifichiamo") || spokenText.includes("ok")) {
              lastActionTime = Date.now();
              isAskingReview = false;
              startReviewMode();
              break;
            } else if (spokenText.includes("no") || spokenText.includes("annulla") || spokenText.includes("fine") || spokenText.includes("salta")) {
              lastActionTime = Date.now();
              isAskingReview = false;
              finishChecklistCompletely();
              break;
            }
          }

          if (spokenText.includes("salta") || spokenText.includes("salta questa") || spokenText.includes("passa oltre")) {
            lastActionTime = Date.now();
            skipItem();
            break;
          }

          const isCheck = 
            spokenText.includes("check") || spokenText.includes("ceck") || spokenText.includes("cec") ||
            spokenText.includes("ciec") || spokenText.includes("cek") || spokenText.includes("gec") ||
            spokenText.includes("geck") || spokenText.includes("c'è") || spokenText.includes("c'e") ||
            spokenText.includes("ce") || spokenText.includes("che") || spokenText.includes("cioè") ||
            spokenText.includes("ok") || spokenText.includes("avanti") || spokenText.includes("passa") ||
            spokenText.includes("fatto") || spokenText.includes("eseguito") || spokenText.includes("va bene") ||
            spokenText.startsWith("ce") || spokenText.startsWith("ci") || spokenText === "c" || spokenText === "k";

          if (isCheck) {
            lastActionTime = Date.now();
            nextItem();
            break;
          } else if (spokenText.includes("ripeti") || spokenText.includes("ancora")) {
            lastActionTime = Date.now();
            speakCurrent();
            break;
          } else if (spokenText.includes("ricomincia") || spokenText.includes("reset")) {
            lastActionTime = Date.now();
            resetChecklist();
            break;
          }
        }
      };

      recognition.onend = () => {
        if (isListening && !isSpeaking) {
          try { recognition.start(); } catch(e) {}
        }
      };
    }

    function speak(text, callback) {
      if (!('speechSynthesis' in window)) {
        if (callback) callback();
        return;
      }

      isSpeaking = true;
      if (recognition) try { recognition.stop(); } catch(e) {}

      document.getElementById('micStatus').innerText = "🔊 Lettura in corso...";
      document.getElementById('micStatus').className = "mic-status";

      window.speechSynthesis.cancel();
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();

      setTimeout(() => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'it-IT';
        utterance.rate = 1.2;
        utterance.pitch = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const itVoice = voices.find(v => v.lang && (v.lang.includes('it') || v.lang.includes('IT')));
        if (itVoice) utterance.voice = itVoice;

        let hasFinished = false;
        const finishSpeech = () => {
          if (hasFinished) return;
          hasFinished = true;
          isSpeaking = false;
          lastActionTime = Date.now();
          if (callback) callback();
          else if (isListening) startListening();
        };

        utterance.onend = finishSpeech;
        utterance.onerror = finishSpeech;

        window.speechSynthesis.speak(utterance);

        const estimatedTime = (text.length * 70) + 800;
        setTimeout(() => {
          if (isSpeaking && !hasFinished) finishSpeech();
        }, estimatedTime);

      }, 50);
    }

    function startChecklist() {
      if (currentChecklist.length === 0) return;
      
      requestWakeLock();
      if ('speechSynthesis' in window) window.speechSynthesis.resume();

      currentIndex = 0;
      isListening = true;
      isAskingReview = false;
      reviewQueue = [];
      reviewIndex = -1;
      skippedItems.clear();
      updateUI();
      
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('endControls').style.display = 'none';

      // Modificato: Pronuncia l'intestazione e direttamente la prima voce di seguito
      const headerText = `Avvio ${checklistsData[currentChecklistIndex].title}`;
      const firstItemText = currentChecklist[0].speak;
      speak(`${headerText}. ${firstItemText}`);
    }

    function startListening() {
      if (recognition && isListening && !isSpeaking) {
        requestWakeLock(); // Rinforzato qui per garantire lo schermo acceso
        try {
          recognition.start();
          document.getElementById('micStatus').innerText = isAskingReview ? "🎙️ In ascolto ('VERIFICA', 'SÌ', 'NO')" : "🎙️ In ascolto ('CHECK', 'SALTA', 'RIPETI')";
          document.getElementById('micStatus').className = "mic-status mic-active";
        } catch(e) {}
      }
    }

    function selectItem(index) {
      if (currentChecklist.length === 0) return;
      currentIndex = index;
      reviewQueue = [];
      reviewIndex = -1;
      isAskingReview = false;
      updateUI();
      speakCurrent();
    }

    function nextItem() {
      if (reviewQueue.length > 0) {
        const actualIdx = reviewQueue[reviewIndex];
        skippedItems.delete(actualIdx);
        advanceReviewQueue();
      } else {
        if (currentIndex >= 0) skippedItems.delete(currentIndex);
        advanceChecklist();
      }
    }

    function skipItem() {
      if (reviewQueue.length > 0) {
        advanceReviewQueue();
      } else {
        if (currentIndex >= 0) skippedItems.add(currentIndex);
        advanceChecklist();
      }
    }

    function advanceChecklist() {
      if (currentIndex < currentChecklist.length - 1) {
        currentIndex++;
        updateUI();
        speakCurrent();
      } else if (currentIndex === currentChecklist.length - 1) {
        handleChecklistEnd();
      }
    }

    function handleChecklistEnd() {
      const countSkipped = skippedItems.size;
      if (countSkipped > 0) {
        isAskingReview = true;
        const parola = countSkipped === 1 ? "istruzione saltata" : "istruzioni saltate";
        document.getElementById('itemText').innerText = "Verifica istruzioni saltate?";
        document.getElementById('statusText').innerText = `⚠️ ${countSkipped} SALTATE`;
        updateUI();
        speak(`Checklist completata. Attenzione: ${countSkipped} ${parola}. Vuoi verificarle?`);
      } else {
        finishChecklistCompletely();
      }
    }

    function startReviewMode() {
      reviewQueue = Array.from(skippedItems).sort((a, b) => a - b);
      reviewIndex = 0;
      currentIndex = reviewQueue[0];
      updateUI();
      speakCurrent();
    }

    function advanceReviewQueue() {
      reviewIndex++;
      if (reviewIndex < reviewQueue.length) {
        currentIndex = reviewQueue[reviewIndex];
        updateUI();
        speakCurrent();
      } else {
        reviewQueue = [];
        reviewIndex = -1;
        if (skippedItems.size > 0) handleChecklistEnd();
        else finishChecklistCompletely();
      }
    }

    function finishChecklistCompletely() {
      isListening = false;
      isAskingReview = false;
      currentIndex = -1;
      
      releaseWakeLock();
      if (recognition) try { recognition.stop(); } catch(e) {}

      document.getElementById('itemText').innerText = "Checklist Completata!";
      document.getElementById('statusText').innerText = "OK";
      document.getElementById('micStatus').innerText = "Microfono spento";
      document.getElementById('micStatus').className = "mic-status";
      document.getElementById('startBtn').style.display = 'none';
      
      document.getElementById('endControls').style.display = 'block';
      if (currentChecklistIndex < checklistsData.length - 1) {
        document.getElementById('nextChecklistBtn').innerText = `➡️ PASSA A: ${checklistsData[currentChecklistIndex + 1].title}`;
        document.getElementById('nextChecklistBtn').style.display = 'inline-block';
      } else {
        document.getElementById('nextChecklistBtn').style.display = 'none';
      }

      updateUI();
      speak("Checklist completata, tutte le voci verificate");
    }

    function goToNextChecklist() {
      if (currentChecklistIndex < checklistsData.length - 1) {
        openChecklist(currentChecklistIndex + 1);
      }
    }

    function speakCurrent() {
      if (currentIndex >= 0 && currentIndex < currentChecklist.length) {
        speak(currentChecklist[currentIndex].speak);
      }
    }

    function updateUI() {
      if (currentIndex >= 0 && currentIndex < currentChecklist.length && !isAskingReview) {
        document.getElementById('itemText').innerText = currentChecklist[currentIndex].item;
        document.getElementById('statusText').innerText = currentChecklist[currentIndex].status;
      }

      currentChecklist.forEach((_, idx) => {
        const row = document.getElementById("row-" + idx);
        if (!row) return;
        row.classList.remove("active-row");

        if (idx === currentIndex) {
          row.classList.add("active-row");
          row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else if (skippedItems.has(idx)) {
          row.classList.add("skipped-row");
        } else {
          row.classList.remove("skipped-row");
        }
      });
    }

    function resetChecklist() {
      isListening = false;
      isSpeaking = false;
      isAskingReview = false;
      reviewQueue = [];
      reviewIndex = -1;
      skippedItems.clear();
      
      releaseWakeLock();
      if (recognition) try { recognition.stop(); } catch(e) {}
      
      currentIndex = -1;
      document.getElementById('itemText').innerText = "Premi AVVIA per iniziare";
      document.getElementById('statusText').innerText = "---";
      document.getElementById('micStatus').innerText = "Microfono spento";
      document.getElementById('micStatus').className = "mic-status";
      document.getElementById('startBtn').style.display = 'inline-block';
      document.getElementById('endControls').style.display = 'none';
      
      currentChecklist.forEach((_, idx) => {
        const row = document.getElementById("row-" + idx);
        if (row) row.classList.remove("active-row", "skipped-row");
      });
      
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderMenu();
  </script>

</body>
</html>
