    function playErrorBeep() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        let now = audioCtx.currentTime;
        let osc1 = audioCtx.createOscillator();
        let gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(440, now);
        gain1.gain.setValueAtTime(0.15, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.12);

        let osc2 = audioCtx.createOscillator();
        let gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(659.25, now + 0.15);
        gain2.gain.setValueAtTime(0.15, now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.27);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.27);
      } catch(e) {}
    }

    function renderMenu() {
      const menuContainer = document.getElementById('menuButtons');

        btn.className = 'btn-menu';
        btn.innerHTML = `<span>${c.title}</span> <span class="badge-status">${c.data.length > 0 ? 'PRONTA' : 'VUOTA'}</span>`;

        menuContainer.appendChild(btn);
      });
    }

    function showMenu() {
      if (cruiseTimer) clearTimeout(cruiseTimer);
      isCruiseTimerActive = false;
      resetChecklist();
      document.getElementById('checklistView').style.display = 'none';
      document.getElementById('menuView').style.display = 'block';
      renderMenu();
    }

    function openChecklist(index) {
      if (cruiseTimer) clearTimeout(cruiseTimer);
      isCruiseTimerActive = false;
      currentChecklistIndex = index;
      currentChecklist = checklistsData[index].data;
      document.getElementById('checklistTitle').innerText = checklistsData[index].title;
      document.getElementById('menuView').style.display = 'none';
      document.getElementById('checklistView').style.display = 'block';
      buildTable();
      resetChecklist();
    }

    function buildTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      if (currentChecklist.length === 0) {
        let row = tbody.insertRow();
        let cell = row.insertCell(0);
        cell.colSpan = 2;
        cell.style.textAlign = "center";
        cell.style.padding = "20px";
        cell.innerText = "Checklist vuota.";
        return;
      }
      currentChecklist.forEach((entry, idx) => {
        if (entry.section) {
          let headerRow = tbody.insertRow();
          headerRow.className = "section-header-row";
          let cell = headerRow.insertCell(0);
          cell.colSpan = 2;
          cell.innerText = entry.section;
        }
        let row = tbody.insertRow();
        row.id = "row-" + idx;
        row.insertCell(0).innerText = entry.item;
        row.insertCell(1).innerText = entry.status;
        row.ondblclick = () => selectItem(idx);
      });
    }

    async function requestWakeLock() {
      try { if ('wakeLock' in navigator && wakeLock === null) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';
      recognition.continuous = false;
      recognition.interimResults = false;
      
      recognition.onresult = (event) => {
        if (isSpeaking) return;
        const spokenText = event.results[0][0].transcript.trim().toLowerCase();

        // GESTIONE TIMER CROCIERA (RISPOSTA SI/NO)
        if (isAskingNext && isCruiseTimerActive) {
          if (spokenText.includes("si") || spokenText.includes("sì") || spokenText.includes("ok") || spokenText.includes("avvia") || spokenText.includes("procediamo")) {
            lastActionTime = Date.now();
            isAskingNext = false;
            isCruiseTimerActive = false;
            openChecklist(6); // Riavvia la checklist 7. CROCIERA (indice 6)
            startChecklist();
            return;
          } else if (spokenText.includes("no") || spokenText.includes("menu")) {
            lastActionTime = Date.now();
            isAskingNext = false;
            isCruiseTimerActive = false;
            speak("Monitoraggio crociera terminato.");
            showMenu();
            return;
          }
        }

        if (!isStandby && (spokenText.includes("standby") || spokenText.includes("stand by") || spokenText.includes("pausa"))) {
          isStandby = true;
          lastActionTime = Date.now();
          updateUI();
          speak("Checklist in standby.");
          return;
        }

        if (isStandby && (spokenText.includes("riprendi") || spokenText.includes("continua") || spokenText.includes("avanti") || spokenText.includes("ok"))) {
          isStandby = false;
          lastActionTime = Date.now();
          updateUI();
          if (currentIndex > 0) {
            currentIndex--;
          }
          speak("Ripresa checklist. " + currentChecklist[currentIndex].speak);
          return;
        }

        if (isStandby) return;

        if (isAskingNext) {
          if (spokenText.includes("avvia") || spokenText.includes("si") || spokenText.includes("sì") || spokenText.includes("ok")) {
            lastActionTime = Date.now();
            isAskingNext = false;
            goToNextChecklist();
            startChecklist();
            return;
          } else if (spokenText.includes("no") || spokenText.includes("menu")) {
            lastActionTime = Date.now();
            isAskingNext = false;
            showMenu();
            return;
          }
        }

        if (isAskingReview) {
          if (spokenText.includes("si") || spokenText.includes("sì") || spokenText.includes("verifica") || spokenText.includes("verifichiamo") || spokenText.includes("verificare") || spokenText.includes("ok")) {
            lastActionTime = Date.now();
            isAskingReview = false;
            startReviewMode();
            return;
          } else if (spokenText.includes("no") || spokenText.includes("annulla") || spokenText.includes("fine") || spokenText.includes("salta")) {
            lastActionTime = Date.now();
            isAskingReview = false;
            finishChecklistCompletely();
            return;
          }
        }

        if (spokenText.includes("salta") || spokenText.includes("passa oltre")) {
          lastActionTime = Date.now();
          skipItem();
          return;
        }

        let currentStatusMatch = "";
        if (currentIndex >= 0 && currentIndex < currentChecklist.length) {
          currentStatusMatch = currentChecklist[currentIndex].status.toLowerCase();
        }

        const isUniversalForward = 
          spokenText.includes("avanti") || spokenText.includes("check") || 
          spokenText.includes("ceck") || spokenText.includes("fatto") || 
          spokenText.includes("eseguito") || spokenText.includes("ok") || 
          spokenText.includes("va bene") || spokenText === "c" || spokenText === "k";

        let isSpecificStatusMatch = false;
        if (currentStatusMatch && spokenText.includes(currentStatusMatch)) {
          isSpecificStatusMatch = true;
        } else {
          if (currentStatusMatch.includes("on") && (spokenText.includes("on") || spokenText === "on")) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("off") && (spokenText.includes("off") || spokenText === "off")) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("inserit") && (spokenText.includes("inseriti") || spokenText.includes("inserito"))) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("chiusa") && spokenText.includes("chiusa")) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("allacciat") && spokenText.includes("allacciate")) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("liberi") && spokenText.includes("liberi")) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("libera") && spokenText.includes("libera")) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("attivo") && spokenText.includes("attivo")) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("all green") && (spokenText.includes("all green") || spokenText.includes("green"))) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("entrambi") && spokenText.includes("entrambi")) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("ricca") && spokenText.includes("ricca")) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("fredda") && spokenText.includes("fredda")) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("archi") && spokenText.includes("archi")) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("verificar") && spokenText.includes("verificare")) isSpecificStatusMatch = true;
          else if (currentStatusMatch.includes("set") && spokenText.includes("set")) isSpecificStatusMatch = true;
        }

        if (isUniversalForward || isSpecificStatusMatch) {
          lastActionTime = Date.now();
          nextItem();
        } else {
          playErrorBeep();
          if (isListening) startListening();
        }
      };

      recognition.onerror = () => {
        if (isListening && !isSpeaking) {
          setTimeout(startListening, 400);
        }
      };

      recognition.onend = () => {
        if (isListening && !isSpeaking) {
          setTimeout(startListening, 400);
        }
      };
    }

    function speak(text, callback) {
      if (!('speechSynthesis' in window)) { if (callback) callback(); return; }
      
      isSpeaking = true;
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }

      document.getElementById('micStatus').innerText = "🔊 Lettura in corso...";
      document.getElementById('micStatus').className = "mic-status";
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'it-IT';
      utterance.rate = 1.2;
      utterance.pitch = 1.0;
      
      utterance.onend = () => {
        isSpeaking = false;
        lastActionTime = Date.now();
        if (callback) {
          callback();
        } else if (isListening) {
          setTimeout(() => {
            if (isListening && !isSpeaking) startListening();
          }, 350);
        }
      };

      utterance.onerror = () => { 
        isSpeaking = false; 
        if (isListening) {
          setTimeout(() => {
            if (isListening && !isSpeaking) startListening();
          }, 350);
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    function startChecklist() {
      if (currentChecklist.length === 0) return;
      requestWakeLock();
      currentIndex = 0;
      isListening = true;
      isStandby = false;
      isAskingReview = false;
      isAskingNext = false;
      isCruiseTimerActive = false;
      reviewQueue = [];
      reviewIndex = -1;
      skippedItems.clear();
      updateUI();
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('endControls').style.display = 'none';
      const title = checklistsData[currentChecklistIndex].title;
      speak(`Avvio checklist ${title}. ${currentChecklist[0].speak}`);
    }

    function startListening() {
      if (recognition && isListening && !isSpeaking) {
        requestWakeLock();
        try {
          recognition.start();
          if (isStandby) {
            document.getElementById('micStatus').innerText = "⏸️ IN STANDBY (Pronuncia 'RIPRENDI')";
            document.getElementById('micStatus').className = "mic-status mic-standby";
          } else {
            let statusMsg = "🎙️ In ascolto (Pronuncia lo stato)";
            if (isAskingNext && isCruiseTimerActive) statusMsg = "🎙️ In ascolto (Ripetizione crociera?)";
            else if (isAskingNext) statusMsg = "🎙️ In ascolto ('SÌ', 'NO')";
            else if (isAskingReview) statusMsg = "🎙️ In ascolto ('SÌ', 'NO', 'VERIFICA')";
            
            document.getElementById('micStatus').innerText = statusMsg;
            document.getElementById('micStatus').className = "mic-status mic-active";
          }
        } catch(e) {}
      }
    }

    function selectItem(index) {
      if (currentChecklist.length === 0) return;
      currentIndex = index;
      reviewQueue = [];
      reviewIndex = -1;
      isStandby = false;
      isAskingReview = false;
      isAskingNext = false;
      isCruiseTimerActive = false;
      updateUI();
      speakCurrent();
    }

    function nextItem() {
      if (reviewQueue.length > 0) {
        const actualIdx = reviewQueue[reviewIndex];
        skippedItems.delete(actualIdx);
        advanceReviewQueue();
      } else {
        if (currentIndex >= 0) skippedItems.delete(currentIndex);
        advanceChecklist();
      }
    }

    function skipItem() {
      if (reviewQueue.length > 0) {
        advanceReviewQueue();
      } else {
        if (currentIndex >= 0) skippedItems.add(currentIndex);
        advanceChecklist();
      }
    }

    function advanceChecklist() {
      if (currentIndex < currentChecklist.length - 1) {
        currentIndex++;
        updateUI();
        speakCurrent();
      } else {
        handleChecklistEnd();
      }
    }

    function handleChecklistEnd() {
      if (skippedItems.size > 0) {
        isAskingReview = true;
        updateUI();
        speak(`Attenzione, ci sono ${skippedItems.size} istruzioni saltate. Vuoi verificarle?`);
      } else {
        finishChecklistCompletely();
      }
    }

    function startReviewMode() {
      reviewQueue = Array.from(skippedItems).sort((a, b) => a - b);
      reviewIndex = 0;
      currentIndex = reviewQueue[0];
      updateUI();
      speak("Inizio revisione elementi saltati. " + currentChecklist[currentIndex].speak);
    }

    function advanceReviewQueue() {
      reviewIndex++;
      if (reviewIndex < reviewQueue.length) {
        currentIndex = reviewQueue[reviewIndex];
        updateUI();
        speak(currentChecklist[currentIndex].speak);
      } else {
        reviewQueue = [];
        reviewIndex = -1;
        finishChecklistCompletely();
      }
    }

    function finishChecklistCompletely() {
      isAskingReview = false;
      currentIndex = -1;
      updateUI();

      // Logica Timer per la Checklist Crociere (30 minuti) con frase aggiornata
      if (checklistsData[currentChecklistIndex].title.includes("CROCIERA")) {
        isCruiseTimerActive = true;
        document.getElementById('itemText').innerText = "Crociera in corso";
        document.getElementById('statusText').innerText = "Timer attivo (30 min)";
        speak("Checklist crociera completata. Timer programmato per la ripetizione della checklist crociera tra 30 minuti.", () => {
          cruiseTimer = setTimeout(() => {
            isAskingNext = true;
            speak("Tempo programmato per la ripetizione della checklist crociera. Procediamo?", () => {
              if (isListening && !isSpeaking) startListening();
            });
          }, CRUISE_INTERVAL_MS);
        });
        return;
      }

      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('endControls').style.display = 'block';
      if (currentChecklistIndex < checklistsData.length - 1) {
        isAskingNext = true;
        const nextTitle = checklistsData[currentChecklistIndex + 1].title;
        speak(`Checklist completata. Vuoi passare alla ${nextTitle}?`);
      } else {
        speak("Checklist completata.");
      }
    }

    function goToNextChecklist() {
      if (currentChecklistIndex < checklistsData.length - 1) {
        openChecklist(currentChecklistIndex + 1);
      } else {
        showMenu();
      }
    }

    function speakCurrent() {
      if (currentIndex >= 0 && currentIndex < currentChecklist.length) {
        speak(currentChecklist[currentIndex].speak);
      }
    }

    function resetChecklist() {
      if (cruiseTimer) clearTimeout(cruiseTimer);
      isCruiseTimerActive = false;
      currentIndex = -1;
      isListening = false;
      isStandby = false;
      isAskingReview = false;
      isAskingNext = false;
      reviewQueue = [];
      reviewIndex = -1;
      skippedItems.clear();
      releaseWakeLock();
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('endControls').style.display = 'none';
      document.getElementById('itemText').innerText = "Premi AVVIA per iniziare";
      document.getElementById('statusText').innerText = "---";
      document.getElementById('micStatus').innerText = "Microfono spento";
      document.getElementById('micStatus').className = "mic-status";
      updateUI();
    }

    function updateUI() {
      if (currentIndex >= 0 && currentIndex < currentChecklist.length) {
        document.getElementById('itemText').innerText = currentChecklist[currentIndex].item;
        document.getElementById('statusText').innerText = currentChecklist[currentIndex].status;
      } else if (isAskingNext && isCruiseTimerActive) {
        document.getElementById('itemText').innerText = "Ripetizione suggerita";
        document.getElementById('statusText').innerText = "Procediamo?";
      } else if (isAskingNext) {
        document.getElementById('itemText').innerText = "Checklist Completata";
        document.getElementById('statusText').innerText = "Passare alla successiva?";
      } else if (isAskingReview) {
        document.getElementById('itemText').innerText = "Elementi saltati presenti";
        document.getElementById('statusText').innerText = "Vuoi verificarli?";
      }

      const rows = document.querySelectorAll('#tableBody tr');
      rows.forEach((row, idx) => {
        row.className = "";
        let dataRowIdx = parseInt(row.id.replace("row-", ""));
        if (!isNaN(dataRowIdx)) {
          if (dataRowIdx === currentIndex) {
            row.className = "active-row";
          } else if (skippedItems.has(dataRowIdx)) {
            row.className = "skipped-row";
          }
        }
      });
    }

    renderMenu();
  </script>
</body>
</html>
