 <!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piper PA-28 Digital Checklist</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00e676;
            --warning-color: #ff9800;
            --danger-color: #f44336;
            --button-bg: #2c2c2c;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent-color);
        }

        .phase-title {
            font-size: 1.2rem;
            color: #888;
            margin-top: 5px;
        }

        .checklist-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-label {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .item-action {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            background-color: var(--button-bg);
            color: var(--text-color);
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:active {
            background-color: #444;
        }

        button.primary {
            background-color: var(--accent-color);
            color: #000;
            grid-column: span 2;
        }

        .progress-bar {
            width: 100%;
            background-color: #333;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>PIPER PA-28 ARCHER/WARRIOR</h1>
        <div class="phase-title" id="phaseDisplay">Ispezione Pre-Volo</div>
    </header>

    <div class="progress-bar">
        <div class="progress-fill" id="progressBar"></div>
    </div>

    <div class="checklist-card" id="checklistContainer">
        <!-- I controlli della checklist vengono generati qui -->
    </div>

    <div class="controls">
        <button id="btnPrev" onclick="prevItem()">Indietro</button>
        <button id="btnSkip" onclick="skipItem()">Salta</button>
        <button class="primary" id="btnNext" onclick="nextItem()">CONFERMA / NEXT</button>
    </div>
</div>

<script>
    const checklistData = [
        {
            phase: "Prima dell'Avviamento",
            items: [
                { item: "Controlli Pre-volo", action: "COMPLETATI" },
                { item: "Cinture di Sicurezza", action: "ALLACCIATE" },
                { item: "Freni di Stazionamento", action: "INSERITI" },
                { item: "Selettore Carburante", action: "SERBATOIO PIÙ PIENO" },
                { item: "Master Switch", action: "ON" }
            ]
        },
        {
            phase: "Avviamento Motore",
            items: [
                { item: "Miscela", action: "RICCA" },
                { item: "Pompa Carburante", action: "ON" },
                { item: "Manetta", action: "APERTURA 1/4" },
                { item: "Area Elica", action: "LIBERA" },
                { item: "Chiave Avviamento", action: "START" }
            ]
        }
    ];

    let currentPhaseIndex = 0;
    let currentItemIndex = 0;

    function updateUI() {
        const currentPhase = checklistData[currentPhaseIndex];
        const currentItem = currentPhase.items[currentItemIndex];

        document.getElementById('phaseDisplay').innerText = currentPhase.phase;

        const container = document.getElementById('checklistContainer');
        container.innerHTML = `
            <div class="item-row">
                <span class="item-label">${currentItem.item}</span>
                <span class="item-action">${currentItem.action}</span>
            </div>
        `;

        // Aggiorna la barra di avanzamento
        const totalItems = currentPhase.items.length;
        const progress = ((currentItemIndex + 1) / totalItems) * 100;
        document.getElementById('progressBar').style.width = `${progress}%`;
    }

    function nextItem() {
        const currentPhase = checklistData[currentPhaseIndex];
        if (currentItemIndex < currentPhase.items.length - 1) {
            currentItemIndex++;
        } else if (currentPhaseIndex < checklistData.length - 1) {
            currentPhaseIndex++;
            currentItemIndex = 0;
        } else {
            alert("Checklist Completata!");
            return;
        }
        updateUI();
    }

    function prevItem() {
        if (currentItemIndex > 0) {
            currentItemIndex--;
        } else if (currentPhaseIndex > 0) {
            currentPhaseIndex--;
            currentItemIndex = checklistData[currentPhaseIndex].items.length - 1;
        }
        updateUI();
    }

    function skipItem() {
        nextItem();
    }

    // Inizializza l'interfaccia al caricamento
    updateUI();
</script>

</body>
</html>
