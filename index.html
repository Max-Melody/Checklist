 <!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Piper PA-28</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 15px; padding: 0; background-color: #f4f4f9; text-align: center; }
    h1 { color: #333; margin-bottom: 10px; font-size: 22px; }
    .menu-grid { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 450px; margin: 15px auto; }
    .btn-menu { padding: 16px; font-size: 18px; font-weight: bold; color: white; background-color: #007bff; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
    .btn-menu:active { background-color: #0056b3; }
    .badge-status { font-size: 14px; background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 5px; }
    .card { position: sticky; top: 10px; z-index: 100; background: white; border: 2px solid #007bff; border-radius: 10px; padding: 15px; margin: 10px auto; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .item-title { font-size: 20px; font-weight: bold; color: #333; }
    .item-status { font-size: 24px; font-weight: bold; color: #d9534f; margin-top: 8px; }
    .mic-status { font-size: 14px; font-weight: bold; margin-top: 8px; color: #666; }
    .mic-active { color: #28a745; }
    .mic-standby { color: #ffc107 !important; }
    .btn { padding: 12px 18px; font-size: 15px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 4px; }
    .btn-start { background-color: #28a745; width: 85%; margin-top: 10px; }
    .btn-repeat { background-color: #ffc107; color: #333; }
    .btn-reset { background-color: #6c757d; }
    .btn-home { background-color: #17a2b8; }
    .btn-next { background-color: #28a745; font-size: 16px; padding: 14px 20px; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
    th, td { border: 1px solid #ccc; padding: 12px 8px; text-align: left; }
    .section-header-row td { background-color: #e9ecef; font-weight: bold; text-align: center; color: #333; }
    .active-row { background-color: #d4edda !important; font-weight: bold; border-left: 5px solid #28a745; color: #000 !important; }
    .skipped-row { background-color: #dc3545 !important; color: white !important; font-weight: bold; border-left: 5px solid #a71d2a; }
    .end-controls { display: none; margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 8px; }
  </style>
</head>
<body>

  <div id="menuView">
    <h1>PIPER PA-28 CHECKLIST</h1>
    <div class="menu-grid" id="menuButtons"></div>
  </div>

  <div id="checklistView" style="display: none;">
    <h1 id="checklistTitle">CHECKLIST</h1>
    <div class="card">
      <div id="itemText" class="item-title">Premi AVVIA per iniziare</div>
      <div id="statusText" class="item-status">---</div>
      <div id="micStatus" class="mic-status">Microfono spento</div>
      <button id="startBtn" class="btn btn-start" onclick="startChecklist()">🎙️ AVVIA CHECKLIST</button>
      <div id="endControls" class="end-controls">
        <button id="nextChecklistBtn" class="btn btn-next" onclick="goToNextChecklist()">➡️ PROSSIMA CHECKLIST</button> <br>
        <button class="btn btn-home" onclick="showMenu()">📋 MENU PRINCIPALE</button>
      </div>
    </div>
    <div>
      <button class="btn btn-repeat" onclick="speakCurrent()">🔊 Ripeti</button>
      <button class="btn btn-reset" onclick="resetChecklist()">🔄 Ricomincia</button>
      <button class="btn btn-home" onclick="showMenu()">📋 Menu</button>
    </div>
    <table id="checklistTable">
      <thead><tr><th>Elemento</th><th>Stato</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    let audioCtx = null;
    function playErrorBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let now = audioCtx.currentTime;
        let osc1 = audioCtx.createOscillator();
        let gain1 = audioCtx.createGain();
        osc1.frequency.setValueAtTime(440, now);
        gain1.gain.setValueAtTime(0.15, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc1.connect(gain1); gain1.connect(audioCtx.destination);
        osc1.start(now); osc1.stop(now + 0.12);
      } catch(e) {}
    }

    const checklistsData = [
      /* ... (La struttura dei dati rimane invariata) ... */
      { id: 0, title: "1. CONTROLLI CABINA", data: [ { item: "Documenti", status: "A BORDO", speak: "Documenti pilota e aeromobile: A bordo" } ] },
      { id: 1, title: "2. AVVIAMENTO", data: [ { item: "Master", status: "ON", speak: "Master batteria: On" } ] },
      { id: 2, title: "3. POST AVVIAMENTO", data: [ { item: "Avionica", status: "ON", speak: "Avionica: On" } ] },
      { id: 3, title: "4. RULLAGGIO E RUN UP", data: [ { item: "Manetta", status: "2.000 RPM", speak: "Manetta: 2000 erre-pi-em" } ] },
      { id: 4, title: "5. PRE DECOLLO", data: [ { item: "Flaps", status: "SET", speak: "Flaps: Set" } ] },
      { id: 5, title: "6. ALLINEAMENTO DECOLLO E SALITA", data: [ { item: "Manetta", status: "FULL", speak: "Manetta: Full" } ] },
      { id: 6, title: "7. CROCIERA", data: [ { item: "Manetta", status: "SET", speak: "Manetta: Come richiesto" }, { item: "Miscela", status: "MAGRA", speak: "Miscela: Magra" } ] },
      { id: 7, title: "8. DISCESA E AVVICINAMENTO", data: [ { item: "Altimetro", status: "QNH", speak: "Altimetro: Q-N-H" } ] },
      { id: 8, title: "9. SOTTOVENTO E FINALE", data: [ { item: "Flaps", status: "10°", speak: "Flaps: Dieci gradi" } ] }
    ];

    let currentChecklistIndex = 0;
    let currentChecklist = [];
    let currentIndex = -1;
    let recognition, isListening = false, isSpeaking = false, isStandby = false;
    let isAskingReview = false, isAskingNext = false, isCruiseTimerActive = false;
    let cruiseTimer = null;
    const TEST_INTERVAL_MS = 30000; 

    function finishChecklistCompletely() {
        isAskingReview = false;
        currentIndex = -1;
        
        if (checklistsData[currentChecklistIndex].title.includes("CROCIERA")) {
            isCruiseTimerActive = true;
            document.getElementById('itemText').innerText = "Attesa: Prossima verifica tra 30 secondi";
            speak("Checklist crociera completata. Avvio timer per prossima verifica tra 30 secondi.", () => {
                cruiseTimer = setTimeout(() => {
                    isAskingNext = true;
                    speak("Attenzione, tempo scaduto. Avviamo la checklist crociera?", () => startListening());
                }, TEST_INTERVAL_MS);
            });
            return;
        }

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('endControls').style.display = 'block';
        if (currentChecklistIndex < checklistsData.length - 1) {
            isAskingNext = true;
            speak(`Checklist completata. Vuoi passare alla ${checklistsData[currentChecklistIndex + 1].title}?`);
        } else {
            speak("Checklist completata.");
        }
    }

    /* ... (Il resto delle funzioni di supporto come startListening, speak, updateUI, ecc. rimangono uguali) ... */
    
    // Inserisci qui le funzioni che già avevi: startListening, speak, updateUI, renderMenu, ecc.
    // Ho abbreviato per brevità del messaggio, ma mantieni le tue funzioni originali per queste.

    renderMenu();
  </script>
</body>
</html>
