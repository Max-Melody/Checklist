 <!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Avviamento Vocale</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 15px;
      padding: 0;
      background-color: #f4f4f9;
      text-align: center;
    }
    h1 { color: #333; margin-bottom: 5px; }
    
    .card {
      position: sticky;
      top: 10px;
      z-index: 100;
      background: white;
      border: 2px solid #007bff;
      border-radius: 10px;
      padding: 15px;
      margin: 10px auto;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .item-title { font-size: 20px; font-weight: bold; color: #333; }
    .item-status { font-size: 24px; font-weight: bold; color: #d9534f; margin-top: 8px; }
    
    .mic-status {
      font-size: 14px;
      font-weight: bold;
      margin-top: 8px;
      color: #666;
    }
    .mic-active { color: #28a745; }

    .btn {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }
    .btn-start { background-color: #28a745; width: 80%; margin-top: 10px; }
    .btn-repeat { background-color: #ffc107; color: #333; }
    .btn-reset { background-color: #6c757d; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;
    }
    th, td { border: 1px solid #ccc; padding: 12px 8px; text-align: left; }
    
    .section-header-row td {
      background-color: #e9ecef;
      font-weight: bold;
      text-align: center;
      color: #333;
    }

    .active-row { 
      background-color: #d4edda !important; 
      font-weight: bold; 
      border-left: 5px solid #28a745;
      color: #000 !important;
    }
    .skipped-row { 
      background-color: #dc3545 !important; 
      color: white !important; 
      font-weight: bold; 
      border-left: 5px solid #a71d2a;
    }
  </style>
</head>
<body>

  <h1>AVVIAMENTO</h1>

  <div class="card">
    <div id="itemText" class="item-title">Premi AVVIA per iniziare</div>
    <div id="statusText" class="item-status">---</div>
    <div id="micStatus" class="mic-status">Microfono spento</div>
    <button id="startBtn" class="btn btn-start" onclick="startChecklist()">🎙️ AVVIA CHECKLIST AVVIAMENTO</button>
  </div>

  <div>
    <button class="btn btn-repeat" onclick="speakCurrent()">🔊 Ripeti</button>
    <button class="btn btn-reset" onclick="resetChecklist()">🔄 Ricomincia</button>
  </div>

  <table id="checklistTable">
    <thead>
      <tr>
        <th>Elemento</th>
        <th>Stato</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    const checklistName = "Checklist Avviamento";

    const checklist = [
      { item: "Telefoni / disp elettronici", status: "OFF / MOD VOLO", speak: "Telefoni e dispositivi elettronici: OFF o Modalità Volo" },
      { item: "Briefing passeggeri", status: "COME RICHIESTO", speak: "Briefing passeggeri: Come richiesto" },
      { item: "Porta", status: "CHIUSA NO BLOCCATA", speak: "Porta: Chiusa non bloccata" },
      { item: "Freno parcheggio", status: "INSERITO", speak: "Freno parcheggio: Inserito" },
      { item: "Sedile", status: "REGOLATO E BLOCCATO", speak: "Sedile: Regolato e bloccato" },
      { item: "Interruttori elettrici", status: "OFF", speak: "Interruttori elettrici: OFF" },
      { item: "Ventilazione cabina", status: "OFF", speak: "Ventilazione cabina: OFF" },
      { item: "Circuit breakers", status: "INSERITI", speak: "Circuit breakers: Inseriti" },
      { item: "Master batteria / alternatore", status: "ON", speak: "Master batteria e alternatore: ON" },
      { item: "Rotating beacon", status: "ON", speak: "Rotating beacon: ON" },
      { item: "Aria carburatore", status: "OFF", speak: "Aria carburatore: OFF" },
      { item: "Miscela", status: "RICCA", speak: "Miscela: Ricca" },
      { item: "Serbatoio", status: "MENO PIENO", speak: "Serbatoio: Meno pieno" },
      { item: "Trim elettrico", status: "OFF", speak: "Trim elettrico: OFF" },
      { item: "Autopilot", status: "OFF", speak: "Autopilot: OFF" },
      { item: "Pompa elettrica carburante", status: "ON", speak: "Pompa elettrica carburante: ON" },
      
      // AVVIAMENTO A FREDDO
      { item: "Manetta", status: "1 cm", speak: "Manetta: Un centimetro" },
      { item: "Primer", status: "3 / 4 volte poi BLOCCARE", speak: "Primer: Tre o quattro volte, poi bloccare" },
      { item: "Via dall'elica", status: "ANNUNCIARE", speak: "Via dall'elica: Annunciare" },
      { item: "Starter", status: "ON", speak: "Starter: ON" },
      { item: "Manetta", status: "1.200 RPM", speak: "Manetta: 1200 RPM" },
      { item: "Pressione OLIO", status: "ARCO VERDE ENTRO 30 \"", speak: "Pressione olio: Arco verde entro 30 secondi" },
      { item: "Pompa elettrica carburante", status: "OFF", speak: "Pompa elettrica carburante: OFF" }
    ];

    let currentIndex = -1;
    let recognition;
    let isListening = false;
    let isSpeaking = false;
    let lastActionTime = 0;
    let skippedItems = new Set();
    
    let isAskingReview = false;
    let reviewQueue = [];
    let reviewIndex = -1;

    let wakeLock = null;

    // Variabili per la gestione del Doppio Tap
    let lastTapTime = 0;
    let lastTapIndex = -1;

    // Gestione Schermo Sempre Acceso
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => {
          wakeLock = null;
        });
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && isListening) {
        await requestWakeLock();
      }
    });

    // Popola la tabella
    const tbody = document.getElementById('tableBody');
    checklist.forEach((entry, idx) => {
      if (idx === 16) {
        let headerRow = tbody.insertRow();
        headerRow.className = "section-header-row";
        let cell = headerRow.insertCell(0);
        cell.colSpan = 2;
        cell.innerText = "AVVIAMENTO A FREDDO";
      }

      let row = tbody.insertRow();
      row.id = "row-" + idx;
      row.insertCell(0).innerText = entry.item;
      row.insertCell(1).innerText = entry.status;
      
      // Controllo doppio tap di sicurezza
      row.onclick = () => handleRowTap(idx);
    });

    function handleRowTap(index) {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTapTime;

      // Se il secondo tocco avviene entro 500ms sulla stessa riga
      if (tapLength < 500 && tapLength > 0 && lastTapIndex === index) {
        selectItem(index);
      }
      
      lastTapTime = currentTime;
      lastTapIndex = index;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        if (isSpeaking || (Date.now() - lastActionTime < 600)) return;

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const spokenText = event.results[i][0].transcript.trim().toLowerCase();

          if (isAskingReview) {
            if (
              spokenText.includes("si") || spokenText.includes("sì") || 
              spokenText.includes("verifica") || spokenText.includes("verifichiamo") || 
              spokenText.includes("confermo") || spokenText.includes("ok")
            ) {
              lastActionTime = Date.now();
              isAskingReview = false;
              startReviewMode();
              break;
            } else if (
              spokenText.includes("no") || spokenText.includes("annulla") || 
              spokenText.includes("fine") || spokenText.includes("salta")
            ) {
              lastActionTime = Date.now();
              isAskingReview = false;
              finishChecklistCompletely();
              break;
            }
          }

          if (
            spokenText.includes("salta") || spokenText.includes("salta questa") || 
            spokenText.includes("passa oltre") || spokenText.includes("salto")
          ) {
            lastActionTime = Date.now();
            skipItem();
            break;
          }

          const isCheck = 
            spokenText.includes("check") || spokenText.includes("ceck") || spokenText.includes("cec") ||
            spokenText.includes("ciec") || spokenText.includes("cek") || spokenText.includes("gec") ||
            spokenText.includes("geck") || spokenText.includes("c'è") || spokenText.includes("c'e") ||
            spokenText.includes("ce") || spokenText.includes("che") || spokenText.includes("cioè") ||
            spokenText.includes("cioc") || spokenText.includes("ciao") || spokenText.includes("set") ||
            spokenText.includes("sic") || spokenText.includes("shake") || spokenText.includes("jack") ||
            spokenText.includes("seck") || spokenText.includes("c'era") || spokenText.includes("c'erano") ||
            spokenText.includes("cieco") || spokenText.includes("ceco") || spokenText.includes("c'es") ||
            spokenText.includes("ci e") || spokenText.includes("c e") || spokenText.includes("c'è k") ||
            spokenText.includes("c'è c") || spokenText.includes("c'è che") || spokenText.includes("c'è il") ||
            spokenText.includes("chek") || spokenText.includes("chec") || spokenText.includes("tech") ||
            spokenText.includes("teck") || spokenText.includes("chack") || spokenText.includes("chaz") ||
            spokenText.includes("ok") || spokenText.includes("avanti") || spokenText.includes("passa") ||
            spokenText.includes("fatto") || spokenText.includes("eseguito") || spokenText.includes("va bene") ||
            spokenText.startsWith("ce") || spokenText.startsWith("ci") || spokenText.startsWith("ge") ||
            spokenText.startsWith("ja") || spokenText === "c" || spokenText === "k";

          if (isCheck) {
            lastActionTime = Date.now();
            nextItem();
            break;
          } else if (
            spokenText.includes("ripeti") || spokenText.includes("ancora") || spokenText.includes("come")
          ) {
            lastActionTime = Date.now();
            speakCurrent();
            break;
          } else if (
            spokenText.includes("ricomincia") || spokenText.includes("da capo") || spokenText.includes("reset")
          ) {
            lastActionTime = Date.now();
            resetChecklist();
            break;
          }
        }
      };

      recognition.onend = () => {
        if (isListening && !isSpeaking) {
          try { recognition.start(); } catch(e) {}
        }
      };
    }

    function speak(text, callback) {
      if (!('speechSynthesis' in window)) {
        if (callback) callback();
        return;
      }

      isSpeaking = true;
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }

      document.getElementById('micStatus').innerText = "🔊 Lettura in corso...";
      document.getElementById('micStatus').className = "mic-status";

      window.speechSynthesis.cancel();
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }

      setTimeout(() => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'it-IT';
        
        utterance.rate = 1.2;
        utterance.pitch = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const itVoice = voices.find(v => v.lang && (v.lang.includes('it') || v.lang.includes('IT')));
        if (itVoice) {
          utterance.voice = itVoice;
        }

        let hasFinished = false;
        const finishSpeech = () => {
          if (hasFinished) return;
          hasFinished = true;
          isSpeaking = false;
          lastActionTime = Date.now();
          if (callback) {
            callback();
          } else if (isListening) {
            startListening();
          }
        };

        utterance.onend = finishSpeech;
        utterance.onerror = (e) => {
          finishSpeech();
        };

        window.speechSynthesis.speak(utterance);

        const estimatedTime = (text.length * 70) + 800;
        setTimeout(() => {
          if (isSpeaking && !hasFinished) {
            finishSpeech();
          }
        }, estimatedTime);

      }, 50);
    }

    function startChecklist() {
      requestWakeLock();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.resume();
      }

      currentIndex = 0;
      isListening = true;
      isAskingReview = false;
      reviewQueue = [];
      reviewIndex = -1;
      skippedItems.clear();
      updateUI();
      
      document.getElementById('startBtn').style.display = 'none';

      speak(`Avvio ${checklistName}`, () => {
        speakCurrent();
      });
    }

    function startListening() {
      if (recognition && isListening && !isSpeaking) {
        try {
          recognition.start();
          if (isAskingReview) {
            document.getElementById('micStatus').innerText = "🎙️ In ascolto ('SÌ', 'VERIFICA', 'NO')";
          } else {
            document.getElementById('micStatus').innerText = "🎙️ In ascolto ('CHECK', 'SALTA', 'RIPETI')";
          }
          document.getElementById('micStatus').className = "mic-status mic-active";
        } catch(e) {}
      }
    }

    function selectItem(index) {
      currentIndex = index;
      reviewQueue = [];
      reviewIndex = -1;
      isAskingReview = false;
      updateUI();
      speakCurrent();
    }

    function nextItem() {
      if (reviewQueue.length > 0) {
        const actualIdx = reviewQueue[reviewIndex];
        skippedItems.delete(actualIdx);
        advanceReviewQueue();
      } else {
        if (currentIndex >= 0) {
          skippedItems.delete(currentIndex);
        }
        advanceChecklist();
      }
    }

    function skipItem() {
      if (reviewQueue.length > 0) {
        advanceReviewQueue();
      } else {
        if (currentIndex >= 0) {
          skippedItems.add(currentIndex);
        }
        advanceChecklist();
      }
    }

    function advanceChecklist() {
      if (currentIndex < checklist.length - 1) {
        currentIndex++;
        updateUI();
        speakCurrent();
      } else if (currentIndex === checklist.length - 1) {
        handleChecklistEnd();
      }
    }

    function handleChecklistEnd() {
      const countSkipped = skippedItems.size;
      
      if (countSkipped > 0) {
        isAskingReview = true;
        const parolaIstruzione = countSkipped === 1 ? "istruzione saltata" : "istruzioni saltate";
        const promptText = `${checklistName} completata. Attenzione: ${countSkipped} ${parolaIstruzione}. Vuoi verificarle?`;
        
        document.getElementById('itemText').innerText = "Verifica istruzioni saltate?";
        document.getElementById('statusText').innerText = `⚠️ ${countSkipped} SALTATE`;
        
        updateUI();
        speak(promptText);
      } else {
        finishChecklistCompletely();
      }
    }

    function startReviewMode() {
      reviewQueue = Array.from(skippedItems).sort((a, b) => a - b);
      reviewIndex = 0;
      currentIndex = reviewQueue[0];
      updateUI();
      speakCurrent();
    }

    function advanceReviewQueue() {
      reviewIndex++;
      if (reviewIndex < reviewQueue.length) {
        currentIndex = reviewQueue[reviewIndex];
        updateUI();
        speakCurrent();
      } else {
        reviewQueue = [];
        reviewIndex = -1;
        if (skippedItems.size > 0) {
          handleChecklistEnd();
        } else {
          finishChecklistCompletely();
        }
      }
    }

    function finishChecklistCompletely() {
      isListening = false;
      isAskingReview = false;
      reviewQueue = [];
      reviewIndex = -1;
      currentIndex = -1;
      
      releaseWakeLock();

      if (recognition) try { recognition.stop(); } catch(e) {}

      document.getElementById('itemText').innerText = `${checklistName} Completata!`;
      document.getElementById('statusText').innerText = "OK";
      document.getElementById('micStatus').innerText = "Microfono spento";
      document.getElementById('micStatus').className = "mic-status";
      document.getElementById('startBtn').style.display = 'inline-block';
      
      updateUI();
      speak(`${checklistName} completata, tutte le voci verificate`);
    }

    function speakCurrent() {
      if (currentIndex >= 0 && currentIndex < checklist.length) {
        speak(checklist[currentIndex].speak);
      }
    }

    function updateUI() {
      if (currentIndex >= 0 && currentIndex < checklist.length && !isAskingReview) {
        document.getElementById('itemText').innerText = checklist[currentIndex].item;
        document.getElementById('statusText').innerText = checklist[currentIndex].status;
      }

      checklist.forEach((_, idx) => {
        const row = document.getElementById("row-" + idx);
        row.classList.remove("active-row");

        if (idx === currentIndex) {
          row.classList.add("active-row");
          row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else if (skippedItems.has(idx)) {
          row.classList.add("skipped-row");
        } else {
          row.classList.remove("skipped-row");
        }
      });
    }

    function resetChecklist() {
      isListening = false;
      isSpeaking = false;
      isAskingReview = false;
      reviewQueue = [];
      reviewIndex = -1;
      skippedItems.clear();
      
      releaseWakeLock();

      if (recognition) try { recognition.stop(); } catch(e) {}
      
      currentIndex = -1;
      document.getElementById('itemText').innerText = "Premi AVVIA per iniziare";
      document.getElementById('statusText').innerText = "---";
      document.getElementById('micStatus').innerText = "Microfono spento";
      document.getElementById('micStatus').className = "mic-status";
      document.getElementById('startBtn').style.display = 'inline-block';
      
      checklist.forEach((_, idx) => {
        const row = document.getElementById("row-" + idx);
        row.classList.remove("active-row", "skipped-row");
      });
      
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>

</body>
</html>
