 <!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Piper PA-28</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            border-radius: 8px;
            margin: 8px;
            width: 100%;
            cursor: pointer;
        }
        .btn:active {
            background-color: #0056b3;
        }
        #schermataMenu {
            display: block;
        }
        #schermataChecklist {
            display: none;
        }
        .item-box {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        #itemCorrente {
            font-size: 26px;
            font-weight: bold;
            color: #4caf50;
            margin-bottom: 10px;
        }
        #statusCorrente {
            font-size: 22px;
            color: #ffeb3b;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- MENU PRINCIPALE -->
    <div id="schermataMenu">
        <h1>Checklist Piper PA-28</h1>
        <div id="listaBottoniMenu"></div>
    </div>

    <!-- SCHERMATA ESECUZIONE CHECKLIST -->
    <div id="schermataChecklist">
        <h2 id="titoloChecklistCorrente"></h2>
        <div class="item-box">
            <div id="itemCorrente">In attesa...</div>
            <div id="statusCorrente"></div>
        </div>
        <button class="btn" style="background-color: #d9534f; margin-top: 20px;" onclick="tornaAlMenu()">Interrompi / Menu</button>
    </div>
</div>

<script>
    // Definizione delle checklist
    const tutteLeChecklist = [
        {
            id: 0,
            nome: "Controlli cabina",
            voci: [
                { item: "Freno di stazionamento", status: "Inserito", speak: "Freno di stazionamento inserito" },
                { item: "Comandi di volo", status: "Liberi e corretti", speak: "Comandi di volo liberi e corretti" },
                { item: "Interruttori elettrici", status: "OFF", speak: "Interruttori elettrici off" },
                { item: "Carburante", status: "Selezionato e quantità ok", speak: "Carburante selezionato e quantità ok" }
            ]
        },
        {
            id: 1,
            nome: "Avviamento",
            voci: [
                { item: "Pompa carburante elettrica", status: "ON", speak: "Pompa carburante elettrica on" },
                { item: "Primer", status: "Come richiesto", speak: "Primer come richiesto" },
                { item: "Elica", status: "Libera", speak: "Elica libera" },
                { item: "Chiave magneti", status: "START", speak: "Chiave magneti start" }
            ]
        }
    ];

    let indiceChecklistAttuale = 0;
    let indiceVoceAttuale = 0;

    function avviaMenu() {
        let contenitore = document.getElementById('listaBottoniMenu');
        contenitore.innerHTML = "";
        tutteLeChecklist.forEach((chk, index) => {
            let btn = document.createElement('button');
            btn.className = "btn";
            btn.innerText = (index + 1) + ". " + chk.nome;
            btn.onclick = () => selezionaChecklist(index);
            contenitore.appendChild(btn);
        });
    }

    function selezionaChecklist(index) {
        indiceChecklistAttuale = index;
        indiceVoceAttuale = 0;
        
        document.getElementById('schermataMenu').style.display = 'none';
        document.getElementById('schermataChecklist').style.display = 'block';
        
        let chk = tutteLeChecklist[indiceChecklistAttuale];
        document.getElementById('titoloChecklistCorrente').innerText = (indiceChecklistAttuale + 1) + ". " + chk.nome;

        // Annuncio iniziale modificato con "Avvio checklist..."
        parlaTesto("Avvio checklist " + (indiceChecklistAttuale + 1) + " " + chk.nome, () => {
            mostraVoceCorrente();
        });
    }

    function mostraVoceCorrente() {
        let chk = tutteLeChecklist[indiceChecklistAttuale];
        if (indiceVoceAttuale >= chk.voci.length) {
            fineChecklist();
            return;
        }

        let voce = chk.voci[indiceVoceAttuale];
        document.getElementById('itemCorrente').innerText = voce.item;
        document.getElementById('statusCorrente').innerText = voce.status;

        parlaTesto(voce.speak, () => {
            // Simulazione dell'ascolto o comando vocale "Avanti"
            setTimeout(() => {
                indiceVoceAttuale++;
                mostraVoceCorrente();
            }, 1500);
        });
    }

    function fineChecklist() {
        document.getElementById('itemCorrente').innerText = "Checklist Completata!";
        document.getElementById('statusCorrente').innerText = "";

        let prossimoIndice = indiceChecklistAttuale + 1;
        if (prossimoIndice < tutteLeChecklist.length) {
            let nomeSuccessiva = tutteLeChecklist[prossimoIndice].nome;
            let testoFine = "Passa a " + nomeSuccessiva;
            
            let btnSuccessiva = document.createElement('button');
            btnSuccessiva.className = "btn";
            btnSuccessiva.style.backgroundColor = "#28a745";
            btnSuccessiva.innerText = testoFine;
            
            // MODIFICA: Tappando sul "Passa a", parte direttamente in automatico
            btnSuccessiva.onclick = () => {
                // Rimuove il bottone prima di procedere
                btnSuccessiva.remove();
                selezionaChecklist(prossimoIndice);
            };
            
            document.getElementById('schermataChecklist').appendChild(btnSuccessiva);

            parlaTesto(testoFine, () => {});
        } else {
            parlaTesto("Tutte le checklist sono completate", () => {});
            let btnMenu = document.createElement('button');
            btnMenu.className = "btn";
            btnMenu.innerText = "Torna al Menu";
            btnMenu.onclick = tornaAlMenu;
            document.getElementById('schermataChecklist').appendChild(btnMenu);
        }
    }

    function parlaTesto(testo, callbackFine) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(testo);
            utterance.lang = 'it-IT';
            utterance.rate = 1.0;
            utterance.onend = function() {
                if (callbackFine) callbackFine();
            };
            window.speechSynthesis.speak(utterance);
        } else {
            if (callbackFine) callbackFine();
        }
    }

    function tornaAlMenu() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        // Pulisce eventuali bottoni dinamici rimasti
        let schermata = document.getElementById('schermataChecklist');
        let bottoniExtra = schermata.querySelectorAll('.btn:not([style*="background-color: #d9534f"])');
        bottoniExtra.forEach(b => b.remove());

        document.getElementById('schermataChecklist').style.display = 'none';
        document.getElementById('schermataMenu').style.display = 'block';
        avviaMenu();
    }

    // Inizializza il menu all'avvio
    window.onload = avviaMenu;
</script>

</body>
</html>
