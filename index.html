 <!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Avviamento Vocale</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 15px;
      padding: 0;
      background-color: #f4f4f9;
      text-align: center;
    }
    h1 { color: #333; margin-bottom: 5px; }
    
    .card {
      position: sticky;
      top: 10px;
      z-index: 100;
      background: white;
      border: 2px solid #007bff;
      border-radius: 10px;
      padding: 15px;
      margin: 10px auto;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .item-title { font-size: 20px; font-weight: bold; color: #333; }
    .item-status { font-size: 24px; font-weight: bold; color: #d9534f; margin-top: 8px; }
    
    .mic-status {
      font-size: 14px;
      font-weight: bold;
      margin-top: 8px;
      color: #666;
    }
    .mic-active { color: #28a745; }

    .btn {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }
    .btn-start { background-color: #28a745; width: 80%; margin-top: 10px; }
    .btn-repeat { background-color: #ffc107; color: #333; }
    .btn-reset { background-color: #6c757d; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;
    }
    th, td { border: 1px solid #ccc; padding: 12px 8px; text-align: left; }
    .active-row { 
      background-color: #d4edda; 
      font-weight: bold; 
      border-left: 5px solid #28a745;
    }
  </style>
</head>
<body>

  <h1>AVVIAMENTO</h1>

  <div class="card">
    <div id="itemText" class="item-title">Premi AVVIA per iniziare</div>
    <div id="statusText" class="item-status">---</div>
    <div id="micStatus" class="mic-status">Microfono spento</div>
    <button id="startBtn" class="btn btn-start" onclick="startChecklist()">🎙️ AVVIA CHECKLIST</button>
  </div>

  <div>
    <button class="btn btn-repeat" onclick="speakCurrent()">🔊 Ripeti</button>
    <button class="btn btn-reset" onclick="resetChecklist()">🔄 Ricomincia</button>
  </div>

  <table id="checklistTable">
    <thead>
      <tr>
        <th>Elemento</th>
        <th>Stato</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    const checklist = [
      { item: "Telefoni / disp elettronici", status: "OFF / MOD VOLO", speak: "Telefoni e dispositivi elettronici: OFF o Modalità Volo" },
      { item: "Briefing passeggeri", status: "COME RICHIESTO", speak: "Briefing passeggeri: Come richiesto" },
      { item: "Porta", status: "CHIUSA NO BLOCCATA", speak: "Porta: Chiusa non bloccata" },
      { item: "Freno parcheggio", status: "INSERITO", speak: "Freno parcheggio: Inserito" },
      { item: "Sedile", status: "REGOLATO E BLOCCATO", speak: "Sedile: Regolato e bloccato" },
      { item: "Interruttori elettrici", status: "OFF", speak: "Interruttori elettrici: OFF" },
      { item: "Ventilazione cabina", status: "OFF", speak: "Ventilazione cabina: OFF" },
      { item: "Circuit breakers", status: "INSERITI", speak: "Circuit breakers: Inseriti" },
      { item: "Master batteria / alternatore", status: "ON", speak: "Master batteria e alternatore: ON" },
      { item: "Rotating beacon", status: "ON", speak: "Rotating beacon: ON" },
      { item: "Aria carburatore", status: "OFF", speak: "Aria carburatore: OFF" },
      { item: "Miscela", status: "RICCA", speak: "Miscela: Ricca" },
      { item: "Serbatoio", status: "MENO PIENO", speak: "Serbatoio: Meno pieno" },
      { item: "Trim elettrico", status: "OFF", speak: "Trim elettrico: OFF" },
      { item: "Autopilot", status: "OFF", speak: "Autopilot: OFF" },
      { item: "Pompa elettrica carburante", status: "ON", speak: "Pompa elettrica carburante: ON" }
    ];

    let currentIndex = -1;
    let recognition;
    let isListening = false;
    let isSpeaking = false;
    let lastActionTime = 0;

    // Popola la tabella
    const tbody = document.getElementById('tableBody');
    checklist.forEach((entry, idx) => {
      let row = tbody.insertRow();
      row.id = "row-" + idx;
      row.insertCell(0).innerText = entry.item;
      row.insertCell(1).innerText = entry.status;
      row.onclick = () => selectItem(idx);
    });

    // Configurazione Riconoscimento Vocale
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        if (isSpeaking || (Date.now() - lastActionTime < 800)) return;

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const spokenText = event.results[i][0].transcript.trim().toLowerCase();

          if (
            spokenText.includes("check") || 
            spokenText.includes("ceck") || 
            spokenText.includes("cec") || 
            spokenText.includes("ciec") || 
            spokenText.includes("cek") || 
            spokenText.includes("gec") || 
            spokenText.includes("geck") || 
            spokenText.includes("c'è") || 
            spokenText.includes("c'e") || 
            spokenText.includes("ce") || 
            spokenText.includes("che") || 
            spokenText.includes("cioè") || 
            spokenText.includes("cioc") || 
            spokenText.includes("ciao") || 
            spokenText.includes("set") || 
            spokenText.includes("sic") || 
            spokenText.includes("shake") || 
            spokenText.includes("jack") || 
            spokenText.includes("seck") || 
            spokenText.includes("ok") || 
            spokenText.includes("avanti") ||
            spokenText.includes("passa")
          ) {
            lastActionTime = Date.now();
            nextItem();
            break;
          } 
          else if (
            spokenText.includes("ripeti") || 
            spokenText.includes("ancora") || 
            spokenText.includes("come")
          ) {
            lastActionTime = Date.now();
            speakCurrent();
            break;
          } 
          else if (
            spokenText.includes("ricomincia") || 
            spokenText.includes("da capo") || 
            spokenText.includes("reset")
          ) {
            lastActionTime = Date.now();
            resetChecklist();
            break;
          }
        }
      };

      recognition.onend = () => {
        if (isListening && !isSpeaking) {
          try { recognition.start(); } catch(e) {}
        }
      };
    }

    function startChecklist() {
      currentIndex = 0;
      isListening = true;
      updateUI();
      speakCurrent();
      document.getElementById('startBtn').style.display = 'none';
    }

    function startListening() {
      if (recognition && isListening && !isSpeaking) {
        try {
          recognition.start();
          document.getElementById('micStatus').innerText = "🎙️ In ascolto ('CHECK', 'RIPETI', 'RICOMINCIA')";
          document.getElementById('micStatus').className = "mic-status mic-active";
        } catch(e) {}
      }
    }

    function speak(text, callback) {
      window.speechSynthesis.cancel();
      isSpeaking = true;
      
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }

      document.getElementById('micStatus').innerText = "🔊 Lettura in corso...";
      document.getElementById('micStatus').className = "mic-status";

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'it-IT';

      utterance.onend = () => {
        isSpeaking = false;
        lastActionTime = Date.now();
        if (isListening) {
          startListening();
        }
        if (callback) callback();
      };

      window.speechSynthesis.speak(utterance);
    }

    function selectItem(index) {
      currentIndex = index;
      updateUI();
      speakCurrent();
    }

    function nextItem() {
      if (currentIndex < checklist.length - 1) {
        currentIndex++;
        updateUI();
        speakCurrent();
      } else if (currentIndex === checklist.length - 1) {
        isListening = false;
        if (recognition) try { recognition.stop(); } catch(e) {}
        document.getElementById('itemText').innerText = "Checklist Completata!";
        document.getElementById('statusText').innerText = "OK";
        document.getElementById('micStatus').innerText = "Microfono spento";
        document.getElementById('micStatus').className = "mic-status";
        document.getElementById('startBtn').style.display = 'inline-block';
        speak("Checklist avviamento completata");
      }
    }

    function speakCurrent() {
      if (currentIndex >= 0 && currentIndex < checklist.length) {
        speak(checklist[currentIndex].speak);
      }
    }

    function updateUI() {
      document.getElementById('itemText').innerText = checklist[currentIndex].item;
      document.getElementById('statusText').innerText = checklist[currentIndex].status;

      checklist.forEach((_, idx) => {
        const row = document.getElementById("row-" + idx);
        if (idx === currentIndex) {
          row.classList.add("active-row");
          // Mantiene la riga attiva ben visibile al centro della schermata
          row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          row.classList.remove("active-row");
        }
      });
    }

    function resetChecklist() {
      isListening = false;
      isSpeaking = false;
      if (recognition) try { recognition.stop(); } catch(e) {}
      currentIndex = -1;
      document.getElementById('itemText').innerText = "Premi AVVIA per iniziare";
      document.getElementById('statusText').innerText = "---";
      document.getElementById('micStatus').innerText = "Microfono spento";
      document.getElementById('micStatus').className = "mic-status";
      document.getElementById('startBtn').style.display = 'inline-block';
      checklist.forEach((_, idx) => {
        document.getElementById("row-" + idx).classList.remove("active-row");
      });
      window.speechSynthesis.cancel();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>

</body>
</html>
